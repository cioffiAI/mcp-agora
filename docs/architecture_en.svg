<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1240" viewBox="0 0 1900 1240">
<style>
.bg{fill:#fffdf7}
.title{font:700 42px Arial,sans-serif;fill:#1e1e1e}
.subtitle{font:400 20px Arial,sans-serif;fill:#555}
.section{font:700 25px Arial,sans-serif;fill:#1e1e1e}
.label{font:700 18px Arial,sans-serif;fill:#1e1e1e}
.body{font:400 16px Arial,sans-serif;fill:#1e1e1e}
.small{font:400 14px Arial,sans-serif;fill:#1e1e1e}
.tiny{font:400 12.5px Arial,sans-serif;fill:#666}
.mono{font:500 14px 'Courier New',monospace;fill:#1e1e1e}
.box{stroke:#1e1e1e;stroke-width:2.4;filter:url(#shadow)}
.inner{stroke:#1e1e1e;stroke-width:1.8}
.sketch{fill:none;stroke:#1e1e1e;stroke-width:1.05;opacity:.22}
.arrow{stroke:#1e1e1e;stroke-width:2.6;fill:none;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
.line{stroke:#1e1e1e;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.dash{stroke-dasharray:8 8}
</style>
<defs>
<marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L0,8 L11,4 z" fill="#1e1e1e"/>
</marker>
<filter id="shadow" x="-10%" y="-10%" width="125%" height="130%">
<feDropShadow dx="2" dy="3" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.12"/>
</filter>
</defs>
<rect class="bg" x="0" y="0" width="1900" height="1240"/><text x="65" y="68" class="title" text-anchor="start">MCP Agora - Local Shared-Memory Architecture</text><text x="68" y="104" class="subtitle" text-anchor="start">Python-only MCP server for cross-agent persistent memory, cache, routing, and external MCP connectors</text><rect x="55" y="150" width="245" height="285" rx="18" ry="18" fill="#e7f5ff" class="box"/><rect x="57" y="151.5" width="241" height="282" rx="18" ry="18" class="sketch"/><text x="85" y="192" class="section" text-anchor="start">AI Agents</text><rect x="85" y="225" width="180" height="36" rx="14" ry="14" fill="#fff" class="inner"/><rect x="86.5" y="226" width="177" height="34" rx="14" ry="14" class="sketch"/><text x="175.0" y="248.0" class="small" text-anchor="middle">Claude Code</text><rect x="85" y="275" width="180" height="36" rx="14" ry="14" fill="#fff" class="inner"/><rect x="86.5" y="276" width="177" height="34" rx="14" ry="14" class="sketch"/><text x="175.0" y="298.0" class="small" text-anchor="middle">Codex / OpenCode</text><rect x="85" y="325" width="180" height="36" rx="14" ry="14" fill="#fff" class="inner"/><rect x="86.5" y="326" width="177" height="34" rx="14" ry="14" class="sketch"/><text x="175.0" y="348.0" class="small" text-anchor="middle">ChatGPT</text><rect x="85" y="375" width="180" height="36" rx="14" ry="14" fill="#fff" class="inner"/><rect x="86.5" y="376" width="177" height="34" rx="14" ry="14" class="sketch"/><text x="175.0" y="398.0" class="small" text-anchor="middle">Gemini CLI</text><rect x="370" y="190" width="245" height="200" rx="18" ry="18" fill="#fff3bf" class="box"/><rect x="372" y="191.5" width="241" height="197" rx="18" ry="18" class="sketch"/><text x="405" y="233" class="section" text-anchor="start">MCP Host</text><text x="405" y="270" class="body"><tspan x="405" dy="0">MCP-compatible client</tspan><tspan x="405" dy="25">local STDIO transport</tspan><tspan x="405" dy="25">JSON-RPC 2.0</tspan></text><rect x="700" y="150" width="460" height="285" rx="18" ry="18" fill="#e6fcf5" class="box"/><rect x="702" y="151.5" width="456" height="282" rx="18" ry="18" class="sketch"/><text x="735" y="192" class="section" text-anchor="start">Agora FastMCP Server</text><text x="735" y="228" class="body"><tspan x="735" dy="0">Exposes MCP tools</tspan><tspan x="735" dy="25">handles memory and cache</tspan><tspan x="735" dy="25">background embedding warmup</tspan></text><rect x="730" y="305" width="400" height="92" rx="14" ry="14" fill="#fff" class="inner"/><rect x="732" y="306.5" width="396" height="89" rx="14" ry="14" class="sketch"/><text x="750" y="334" class="label" text-anchor="start">Exposed tools</text><rect x="750" y="350" width="82" height="23" rx="14" ry="14" fill="#d3f9d8" class="inner"/><rect x="751.5" y="351" width="79" height="21" rx="14" ry="14" class="sketch"/><text x="791.0" y="366.5" class="small" text-anchor="middle">save</text><rect x="843" y="350" width="82" height="23" rx="14" ry="14" fill="#d3f9d8" class="inner"/><rect x="844.5" y="351" width="79" height="21" rx="14" ry="14" class="sketch"/><text x="884.0" y="366.5" class="small" text-anchor="middle">query</text><rect x="936" y="350" width="82" height="23" rx="14" ry="14" fill="#d3f9d8" class="inner"/><rect x="937.5" y="351" width="79" height="21" rx="14" ry="14" class="sketch"/><text x="977.0" y="366.5" class="small" text-anchor="middle">crossref</text><rect x="1029" y="350" width="82" height="23" rx="14" ry="14" fill="#d3f9d8" class="inner"/><rect x="1030.5" y="351" width="79" height="21" rx="14" ry="14" class="sketch"/><text x="1070.0" y="366.5" class="small" text-anchor="middle">forget</text><rect x="750" y="381" width="82" height="23" rx="14" ry="14" fill="#d3f9d8" class="inner"/><rect x="751.5" y="382" width="79" height="21" rx="14" ry="14" class="sketch"/><text x="791.0" y="397.5" class="small" text-anchor="middle">route</text><rect x="843" y="381" width="82" height="23" rx="14" ry="14" fill="#d3f9d8" class="inner"/><rect x="844.5" y="382" width="79" height="21" rx="14" ry="14" class="sketch"/><text x="884.0" y="397.5" class="small" text-anchor="middle">broadcast</text><rect x="936" y="381" width="82" height="23" rx="14" ry="14" fill="#d3f9d8" class="inner"/><rect x="937.5" y="382" width="79" height="21" rx="14" ry="14" class="sketch"/><text x="977.0" y="397.5" class="small" text-anchor="middle">backends</text><rect x="1029" y="381" width="82" height="23" rx="14" ry="14" fill="#d3f9d8" class="inner"/><rect x="1030.5" y="382" width="79" height="21" rx="14" ry="14" class="sketch"/><text x="1070.0" y="397.5" class="small" text-anchor="middle">status</text><rect x="1245" y="150" width="565" height="285" rx="18" ry="18" fill="#fff4e6" class="box"/><rect x="1247" y="151.5" width="561" height="282" rx="18" ry="18" class="sketch"/><text x="1280" y="192" class="section" text-anchor="start">Router + Registry</text><text x="1280" y="228" class="body"><tspan x="1280" dy="0">1. Exact-name match</tspan><tspan x="1280" dy="25">2. Semantic match</tspan><tspan x="1280" dy="25">threshold &gt;= 0.5</tspan><tspan x="1280" dy="25">BackendRegistry</tspan><tspan x="1280" dy="25">lazy connect</tspan></text><rect x="1515" y="210" width="250" height="190" rx="14" ry="14" fill="#fff" class="inner"/><rect x="1517" y="211.5" width="246" height="187" rx="14" ry="14" class="sketch"/><text x="1540" y="242" class="label" text-anchor="start">Backend connectors</text><text x="1540" y="274" class="body"><tspan x="1540" dy="0">STDIO connector</tspan><tspan x="1540" dy="23">HTTP connector</tspan><tspan x="1540" dy="23">read-only guard</tspan><tspan x="1540" dy="23">retry + rate limit</tspan><tspan x="1540" dy="23">health check</tspan></text><rect x="80" y="555" width="240" height="235" rx="18" ry="18" fill="#ffffff" class="box"/><rect x="82" y="556.5" width="236" height="232" rx="18" ry="18" class="sketch"/><text x="110" y="596" class="section" text-anchor="start">SQLite metadata</text><text x="110" y="637" class="mono"><tspan x="110" dy="0">agents</tspan><tspan x="110" dy="25">provenance</tspan><tspan x="110" dy="25">l2_cache</tspan><tspan x="110" dy="25">db_size/status</tspan></text><rect x="390" y="535" width="390" height="285" rx="18" ry="18" fill="#fff0f6" class="box"/><rect x="392" y="536.5" width="386" height="282" rx="18" ry="18" class="sketch"/><text x="425" y="578" class="section" text-anchor="start">Cache layer</text><text x="425" y="616" class="body"><tspan x="425" dy="0">L1: in-memory TTLCache</tspan><tspan x="425" dy="25">5 minutes, 1000 entries</tspan><tspan x="425" dy="25">L2: persistent SQLite</tspan><tspan x="425" dy="25">24 hours, 10000 entries</tspan><tspan x="425" dy="25">save: clear L1 + L2</tspan></text><rect x="850" y="535" width="420" height="285" rx="18" ry="18" fill="#f3f0ff" class="box"/><rect x="852" y="536.5" width="416" height="282" rx="18" ry="18" class="sketch"/><text x="885" y="578" class="section" text-anchor="start">Memory layer</text><text x="885" y="616" class="body"><tspan x="885" dy="0">Local embedding:</tspan><tspan x="885" dy="25">all-MiniLM-L6-v2, 384d</tspan><tspan x="885" dy="25">ChromaDB PersistentClient</tspan><tspan x="885" dy="25">collection: &quot;knowledge&quot;</tspan><tspan x="885" dy="25">similarity: cosine</tspan></text><rect x="1370" y="535" width="360" height="260" rx="18" ry="18" fill="#e9fac8" class="box"/><rect x="1372" y="536.5" width="356" height="257" rx="18" ry="18" class="sketch"/><text x="1405" y="578" class="section" text-anchor="start">External MCP servers</text><text x="1405" y="617" class="body"><tspan x="1405" dy="0">GitHub MCP</tspan><tspan x="1405" dy="28">Playwright MCP</tspan><tspan x="1405" dy="28">DB / FS / Custom MCP</tspan></text><path d="M 300,292 L 370,292" class="arrow"/><path d="M 301.2,293.0 L 371.2,293.0" class="line" opacity=".20"/><rect x="309" y="253" width="93.0" height="26" rx="8" fill="#fffdf7" stroke="#ddd" stroke-width="1"/><text x="318" y="272" class="tiny" text-anchor="start">tools/call</text><path d="M 615,292 L 700,292" class="arrow"/><path d="M 616.2,293.0 L 701.2,293.0" class="line" opacity=".20"/><rect x="631" y="253" width="93.0" height="26" rx="8" fill="#fffdf7" stroke="#ddd" stroke-width="1"/><text x="640" y="272" class="tiny" text-anchor="start">tools/call</text><path d="M 1160,292 L 1245,292" class="arrow"/><path d="M 1161.2,293.0 L 1246.2,293.0" class="line" opacity=".20"/><rect x="1173" y="253" width="93.0" height="26" rx="8" fill="#fffdf7" stroke="#ddd" stroke-width="1"/><text x="1182" y="272" class="tiny" text-anchor="start">route path</text><path d="M 850,435 L 850,485 L 585,485 L 585,535" class="arrow"/><path d="M 851.2,436.0 L 851.2,486.0 L 586.2,486.0 L 586.2,536.0" class="line" opacity=".20"/><rect x="595" y="447" width="93.0" height="26" rx="8" fill="#fffdf7" stroke="#ddd" stroke-width="1"/><text x="604" y="466" class="tiny" text-anchor="start">query path</text><path d="M 1025,435 L 1025,485 L 1060,485 L 1060,535" class="arrow"/><path d="M 1026.2,436.0 L 1026.2,486.0 L 1061.2,486.0 L 1061.2,536.0" class="line" opacity=".20"/><rect x="1066" y="447" width="85.5" height="26" rx="8" fill="#fffdf7" stroke="#ddd" stroke-width="1"/><text x="1075" y="466" class="tiny" text-anchor="start">save path</text><path d="M 1640,400 L 1640,470 L 1550,470 L 1550,535" class="arrow"/><path d="M 1641.2,401.0 L 1641.2,471.0 L 1551.2,471.0 L 1551.2,536.0" class="line" opacity=".20"/><rect x="1643" y="449" width="115.5" height="26" rx="8" fill="#fffdf7" stroke="#ddd" stroke-width="1"/><text x="1652" y="468" class="tiny" text-anchor="start">MCP tool call</text><path d="M 1490,435 L 1490,505 L 1450,505 L 1450,535" class="arrow"/><path d="M 1491.2,436.0 L 1491.2,506.0 L 1451.2,506.0 L 1451.2,536.0" class="line" opacity=".20"/><rect x="1491" y="488" width="85.5" height="26" rx="8" fill="#fffdf7" stroke="#ddd" stroke-width="1"/><text x="1500" y="507" class="tiny" text-anchor="start">lazy call</text><path d="M 500,820 L 500,860 L 230,860 L 230,790" class="arrow dash"/><path d="M 501.2,821.0 L 501.2,861.0 L 231.2,861.0 L 231.2,791.0" class="line" opacity=".20"/><rect x="309" y="824" width="78.0" height="26" rx="8" fill="#fffdf7" stroke="#ddd" stroke-width="1"/><text x="318" y="843" class="tiny" text-anchor="start">L2 cache</text><path d="M 960,820 L 960,885 L 190,885 L 190,790" class="arrow dash"/><path d="M 961.2,821.0 L 961.2,886.0 L 191.2,886.0 L 191.2,791.0" class="line" opacity=".20"/><rect x="603" y="849" width="93.0" height="26" rx="8" fill="#fffdf7" stroke="#ddd" stroke-width="1"/><text x="612" y="868" class="tiny" text-anchor="start">provenance</text><path d="M 1060,820 L 1060,855 L 1185,855 L 1185,820" class="arrow dash"/><path d="M 1061.2,821.0 L 1061.2,856.0 L 1186.2,856.0 L 1186.2,821.0" class="line" opacity=".20"/><rect x="1071" y="827" width="108.0" height="26" rx="8" fill="#fffdf7" stroke="#ddd" stroke-width="1"/><text x="1080" y="846" class="tiny" text-anchor="start">vector store</text><rect x="55" y="910" width="1755" height="210" rx="18" ry="18" fill="#f8f9fa" class="box"/><rect x="57" y="911.5" width="1751" height="207" rx="18" ry="18" class="sketch"/><text x="85" y="956" class="section" text-anchor="start">Main flows</text><rect x="85" y="985" width="550" height="88" rx="13" ry="13" fill="#fff" class="inner"/><rect x="87" y="986.5" width="546" height="85" rx="13" ry="13" class="sketch"/><text x="109" y="1020" class="label" text-anchor="start">SAVE</text><text x="197" y="1012" class="small"><tspan x="197" dy="0">Agent -&gt; agora_save -&gt; embeddings</tspan><tspan x="197" dy="23">ChromaDB + SQLite provenance</tspan></text><rect x="660" y="985" width="550" height="88" rx="13" ry="13" fill="#fff" class="inner"/><rect x="662" y="986.5" width="546" height="85" rx="13" ry="13" class="sketch"/><text x="684" y="1020" class="label" text-anchor="start">QUERY</text><text x="772" y="1012" class="small"><tspan x="772" dy="0">Agent -&gt; agora_query -&gt; L1</tspan><tspan x="772" dy="23">L2 -&gt; ChromaDB semantic search</tspan></text><rect x="1235" y="985" width="550" height="88" rx="13" ry="13" fill="#fff" class="inner"/><rect x="1237" y="986.5" width="546" height="85" rx="13" ry="13" class="sketch"/><text x="1259" y="1020" class="label" text-anchor="start">ROUTE</text><text x="1347" y="1012" class="small"><tspan x="1347" dy="0">Agent -&gt; agora_route/broadcast -&gt; Router</tspan><tspan x="1347" dy="23">Connector -&gt; external MCP</tspan></text><text x="65" y="1162" class="tiny" text-anchor="start">Dashed arrows indicate persistent metadata/cache, not the primary execution flow.</text><text x="65" y="1182" class="tiny" text-anchor="start">Synthetic diagram derived from repo cioffiAI/mcp-agora.</text></svg>