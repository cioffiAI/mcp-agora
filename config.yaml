# MCP Agora — Configuration
# =========================
# Override path: AGORA_CONFIG=/path/to/config.yaml uv run agora
#
# This file controls all Agora settings: server identity, storage paths,
# cache behavior, embedding model, and external MCP backends.
#
# Environment variables are expanded ($VAR or ${VAR}) in all string values.

# ── Server Identity ───────────────────────────────────────────────────
# Exposed via MCP tools/list and used in status responses.
agora:
  name: "Agora"                         # Human-readable server name
  version: "0.4.0"                      # Semver — bump on tagged release

# ── Storage ───────────────────────────────────────────────────────────
# Agora uses two persistent stores:
#   ChromaDB  — vector embeddings for semantic search (single "knowledge" collection)
#   SQLite    — relational tables for agent registry, provenance tracking, and L2 cache
# Both paths support ~/ expansion and $ENV_VAR substitution.
storage:
  chroma_path: "~/.agora/chroma"        # ChromaDB PersistentClient directory
  db_path: "~/.agora/agora.db"          # SQLite: agents + provenance + l2_cache

# ── Cache ─────────────────────────────────────────────────────────────
# Two-tier cache cascade: L1 (in-memory) → L2 (SQLite disk) → ChromaDB.
# Cache key = SHA256 of full JSON-serialized request (all params, sort_keys=True).
# On agora_save / agora_forget: full clear of both L1 and L2 (safe strategy).
cache:
  l1_max_entries: 1000                  # Max entries in L1 TTLCache
  l1_ttl_seconds: 300                   # L1 TTL (seconds). Default: 5 min — frequent queries
  l2_max_entries: 10000                 # Max entries in L2 SQLite cache
  l2_ttl_seconds: 86400                 # L2 TTL (seconds). Default: 24h — expensive/long-lived

# ── Embedding ─────────────────────────────────────────────────────────
# Converts text to vectors for semantic search.
# Default: sentence-transformers (fully local, free, no API key).
# Model downloaded on first use (~80MB), cached in ~/.cache/agora/models/.
# Lazy-loaded (not at import) + background warmup thread at server start.
embedding:
  provider: "sentence-transformers"     # Provider name (pluggable interface)
  model: "all-MiniLM-L6-v2"            # Model name. 384 dimensions, ~80MB disk

# ── External MCP Backends ─────────────────────────────────────────────
# Backends declared here are registered at server start.
# Connection is LAZY — established on first tool call, never at startup.
# Each backend supports:
#
#   transport:       "stdio" (local subprocess) or "http" (streamable HTTP)
#   command/url:     command array for STDIO, URL for HTTP (mutually exclusive)
#   description:     used by the semantic router (cosine similarity on embeddings)
#   read_only:       when true, blocks tools with mutative prefixes
#                    (create_, delete_, update_, write_, set_, put_, patch_,
#                     add_, remove_, edit_, send_, upload_)
#   timeout_seconds: max wait for connect + tool call
#   max_retries:     retry count on transient errors (ConnectionError, TimeoutError, OSError)
#   retry_delay:     initial backoff (doubles each attempt: d, 2d, 4d... cap at 30s)
#   rate_limit_rps:  max calls per second (0 = disabled)
#   env:             extra environment variables with $VAR expansion
backends:
  - name: "github"
    transport: "stdio"
    command: ["npx", "-y", "@modelcontextprotocol/server-github"]
    description: "GitHub API: issues, PRs, repos, code search, commits"
    read_only: false                     # false = write tools allowed (create_*, etc.)
    timeout_seconds: 15                  # GitHub API usually responds in <5s
    max_retries: 3                       # retry on transient network errors
    retry_delay: 1.0                     # 1s → 2s → 4s
    rate_limit_rps: 5                    # max 5 calls/second (GitHub has 5000/hr)
    env:
      GITHUB_TOKEN: "${GITHUB_TOKEN}"    # Required — set via "gh auth token"

  - name: "playwright"
    transport: "stdio"
    command: ["npx", "@playwright/mcp@latest"]
    description: "Browser automation: navigate, click, screenshot, forms"
    read_only: true                      # blocks all mutative tool prefixes
    timeout_seconds: 30                  # browser actions can be slow
    max_retries: 2                       # browser crashes are rare, 2 retries enough
    retry_delay: 0.5                     # 0.5s → 1s
    rate_limit_rps: 2                    # browser automation is local, no API limit
