[project]
name = "mcp-agora"
version = "0.4.0"
description = "MCP gateway with cross-agent persistent memory for AI agent fleets"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cachetools",
    "chromadb",
    "httpx",
    "mcp>=1.0.0",
    "pyyaml",
    "sentence-transformers>=3.0.0",
]

[project.scripts]
agora = "agora.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.11.0",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
