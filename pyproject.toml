[project]
name = "mcp-agora"
version = "0.1.0"
description = "MCP gateway with cross-agent persistent memory for AI agent fleets"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cachetools",
    "chromadb",
    "httpx",
    "mcp>=1.0.0",
    "pyyaml",
    "sentence-transformers>=3.0.0",
]

[project.scripts]
agora = "agora.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
